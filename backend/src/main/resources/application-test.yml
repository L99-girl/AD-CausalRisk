# Local run profile: H2 in MySQL compatibility mode (no MySQL needed).
#
# The datasource is a FILE-backed H2 database (not in-memory) so that data
# written during a session survives backend restarts. The file lives under
# ./data/adcausalrisk (relative to the backend working directory) and is
# created on first boot. ddl-auto is validate; Flyway owns the schema.
spring:
  datasource:
    url: "jdbc:h2:file:./data/adcausalrisk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration